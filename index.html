    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #020b06; /* Deep forest dark green */
            font-family: 'Outfit', 'Inter', sans-serif; 
            color: #ffffff;
            user-select: none;
        }
        
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.25;
            z-index: 1;
        }

        .perspective-grid {
            position: absolute;
            bottom: -18%;
            left: -50%;
            width: 200%;
            height: 65vh;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.15) 1px, transparent 1px), /* Emerald green tint */
                linear-gradient(90deg, rgba(16, 185, 129, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(650px) rotateX(65deg);
            transform-origin: bottom center;
            pointer-events: none;
            opacity: 0.6;
            z-index: 2;
        }

        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.1) 0%, rgba(2, 11, 6, 0.95) 75%);
            pointer-events: none;
            z-index: 2;
        }

        #three-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.85;
            pointer-events: none;
        }

        /* Styling variables */
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .unknown-pulse {
            color: #f43f5e;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
            animation: pulse-glow 1s infinite alternate;
            font-weight: 900;
        }

        /* Animations */
        @keyframes pulse-glow {
            from { text-shadow: 0 0 5px rgba(244, 63, 94, 0.5); transform: scale(1); }
            to { text-shadow: 0 0 25px rgba(244, 63, 94, 1); transform: scale(1.05); }
        }

        @keyframes robot-celebrate {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-14px) rotate(-6deg) scale(1.08); }
            75% { transform: translateY(-14px) rotate(6deg) scale(1.08); }
        }
        .animate-robot-celebrate { animation: robot-celebrate 0.5s ease-in-out infinite; }

        @keyframes robot-sad {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-8px) rotate(-4deg); }
            40% { transform: translateX(8px) rotate(4deg); }
            60% { transform: translateX(-6px) rotate(-2deg); }
            80% { transform: translateX(6px) rotate(2deg); }
        }
        .animate-robot-sad { animation: robot-sad 0.7s ease-in-out infinite; }

        @keyframes robot-think {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-5px) rotate(-3deg); }
        }
        .animate-robot-think { animation: robot-think 2s ease-in-out infinite; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(2, 44, 34, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const COLORS = {
            emerald: '#10b981', // Main theme
            teal: '#14b8a6',
            pink: '#f43f5e',
            neonGreen: '#22c55e',
            neonOrange: '#f97316',
            neonYellow: '#eab308'

        const ExercisesDB = [
            {
                id: 1, 
                title: "Módulo 1: Fundamentos",
                story: `Analizaremos la definición y los tres atributos fundamentales que estructuran la biodiversidad. Escanea los datos primarios para avanzar.`,
                initialData: { "Tópico": "Definición", "Nivel de Análisis": "Macro", "Biodiversidad": "?", "Atributos": "?" },
                steps: [
                    {
                        q: "¿Cómo se define formalmente la biodiversidad en el ámbito ecológico?",
                        opts: [
                            "Exclusivamente como la cantidad de animales vertebrados presentes en una reserva natural.",
                            "Como la variedad de especies vivas sobre la Tierra de todos los grupos taxonómicos en un espacio determinado.",
                            "Únicamente como la cantidad de biomasa de la flora presente en bosques tropicales.",
                            "Como el total de recursos económicos derivados de la explotación del suelo."
                        ], ans: 1,
                        boardTag: "DEFINICIÓN OFICIAL", 
                        boardInit: `Biodiversidad = <span class='unknown-pulse text-5xl ml-4'>?</span>`, 
                        boardFinal: `Biodiversidad = <b class='text-emerald-400 font-bold text-4xl ml-4 drop-shadow-lg'>Variedad de Especies Vivas</b>`,
                        updateData: { "Biodiversidad": "Definida" },
                        fb_c: "¡Correcto! Abarca toda la variedad biológica de la Tierra.", fb_w: "Revisa la opción que engloba a todos los grupos taxonómicos."
                    },
                    {
                        q: "¿Cuáles son los tres atributos fundamentales que definen la biodiversidad?",
                        opts: [
                            "Origen, evolución y extinción.",
                            "Riqueza, abundancia y dominancia.",
                            "Composición, estructura y función.",
                            "Genética, taxonomía y geografía."
                        ], ans: 2,
                        boardTag: "LOS 3 ATRIBUTOS", 
                        boardInit: `Atributos Clave = <span class='unknown-pulse text-5xl ml-4'>?</span>`, 
                        boardFinal: `Atributos = <b class='text-white font-bold text-3xl ml-4'>Composición, Estructura, Función</b>`,
                        updateData: { "Atributos": "Identificados" },
                        fb_c: "¡Exacto! Son los pilares de la organización ecológica.", fb_w: "Estos atributos definen qué hay, cómo se organiza y qué interacciones existen."
                    },
                    {
                        q: "¿En qué consiste el atributo de composición de la biodiversidad?",
                        opts: [
                            "Explica cómo interactúan las especies ecológicamente a través de la depredación y la simbiosis.",
                            "Mide la abundancia relativa de especies y la conectividad entre los ecosistemas.",
                            "Identifica qué especies están presentes y cuántos tipos existen en un área determinada.",
                            "Analiza las variaciones fenotípicas causadas por mutaciones genéticas."
                        ], ans: 2,
                        boardTag: "ATRIBUTO: COMPOSICIÓN", 
                        boardInit: `Composición evalúa: <br/><br/> <span class='unknown-pulse text-4xl'>¿Quiénes y cuántos son?</span>`, 
                        boardFinal: `Composición evalúa: <br/><br/> <b class='text-teal-400 font-bold text-4xl'>Identidad y Variedad de Especies</b>`,
                        updateSim: { connectDist: 5, nodes: 50 },
                        fb_c: "Identifica la presencia y variedad de entidades biológicas.", fb_w: "La composición responde a las preguntas: ¿Qué especies hay y cuántas son?"
                    },
                    {
                        q: "¿Qué aspecto analiza el atributo de estructura dentro de la biodiversidad?",
                        opts: [
                            "La organización de la biodiversidad mediante la abundancia relativa de especies/ecosistemas y el grado de conectividad.",
                            "El número total de secuencias de ADN presentes en una especie dada.",
                            "Los tipos de servicios gubernamentales que los ecosistemas proveen a las ciudades.",
                            "La tasa de descomposición de materia orgánica en el suelo."
                        ], ans: 0,
                        boardTag: "ATRIBUTO: ESTRUCTURA", 
                        boardInit: `Estructura evalúa: <br/><br/> <span class='unknown-pulse text-4xl'>¿Cómo se organizan?</span>`, 
                        boardFinal: `Estructura evalúa: <br/><br/> <b class='text-teal-400 font-bold text-4xl'>Organización y Conectividad</b>`,
                        updateSim: { connectDist: 25, nodes: 100 },
                        fb_c: "La conectividad y organización física definen la estructura.", fb_w: "Se refiere a la forma en que los componentes biológicos se organizan en el espacio."
                    },
                    {
                        q: "El atributo de función reconoce principalmente:",
                        opts: [
                            "Qué grupos taxonómicos se han extinguido en una zona específica.",
                            "Cómo interactúan las especies evolutiva y ecológicamente (ej. depredación, simbiosis y ciclo de nutrientes).",
                            "El porcentaje exacto de especies marinas clasificadas en peligro crítico.",
                            "La riqueza total de especies sin considerar sus interacciones."

                        boardTag: "ATRIBUTO: FUNCIÓN", 
                        boardInit: `Función = <span class='unknown-pulse text-5xl ml-4'>?</span>`, 
                        boardFinal: `Función = <b class='text-emerald-400 font-black text-5xl ml-4 drop-shadow-lg'>Interacciones Ecológicas</b>`,
                        updateData: { "Estado del Análisis": "Completado" }, updateSim: { speed: 1.5, connectDist: 35 },
                        fb_c: "¡Módulo superado! La función se basa en la interacción vital.", fb_w: "Recuerda, la función implica procesos dinámicos y relaciones (depredación, simbiosis).", isFinal: true
                    }
                ]
            },
            {
                id: 2, 
                title: "Módulo 2: Niveles y Medición",
                story: `La biodiversidad se organiza en distintos niveles y puede cuantificarse usando herramientas estadísticas. Configuremos los parámetros métricos.`,
                initialData: { "Niveles": "?", "Biodiversidad Genética": "?", "Riqueza/Uniformidad": "?", "Índices": "?" },
                steps: [
                    {
                        q: "¿Cuáles son los tres niveles o tipos de biodiversidad estudiados en la literatura científica?",

                            "Terrestre, acuática y atmosférica.",
                            "Genética, taxonómica (o de especies) y de ecosistemas.",

                            "Botánica, zoológica y microbiológica."

                        boardTag: "NIVELES DE BIODIVERSIDAD", 
                        boardInit: `Jerarquía Ecológica: <span class='unknown-pulse text-4xl ml-4'>?</span>`, 
                        boardFinal: `Niveles: <b class='text-white font-bold text-3xl'>Genética, Taxonómica, Ecosistemas</b>`, 
                        updateData: { "Niveles": "Gen, Especie, Ecosistema" }, fb_c: "¡Bien! Estos abarcan desde el ADN hasta biomas completos.", fb_w: "Busca la opción que va de la escala molecular a la ecológica."

                    {
                        q: "¿En qué se enfoca la biodiversidad genética y cómo se manifiesta visiblemente?",

                            "En la diversidad de hábitats marinos y se expresa mediante la temperatura del agua.",
                            "En la diversidad de genes expresados entre y dentro de una misma especie, manifestándose en el fenotipo.",
                            "En la cantidad de especies cultivadas bajo el sistema de monocultivo.",
                            "En la tasa de aceleración de las extinciones masivas de microorganismos."

                        boardTag: "BIODIVERSIDAD GENÉTICA", 
                        boardInit: `Nivel Molecular = <span class='unknown-pulse text-4xl ml-4'>?</span>`, 
                        boardFinal: `Expresión Genética = <b class='text-white font-bold text-4xl ml-2'>Fenotipo</b>`, 
                        updateData: { "Biodiversidad Genética": "Diversidad Fenotípica" }, fb_c: "Correcto. Los genes determinan la variedad física (fenotipo).", fb_w: "Se enfoca en la variabilidad dentro de una misma especie."
                    },
                    {
                        q: "Al analizar la biodiversidad de especies, ¿cuál es la diferencia entre riqueza y uniformidad?",
                        opts: [
                            "La riqueza es el número total de especies en un área; la uniformidad indica cómo se distribuyen sus abundancias.",
                            "La riqueza mide la biomasa total y la uniformidad el número de individuos machos y hembras.",
                            "La riqueza calcula la edad reproductiva promedio y la uniformidad su tasa de natalidad.",
                            "La riqueza se mide con el índice de Simpson y la uniformidad solo mediante imágenes satelitales."
                        ], ans: 0,
                        boardTag: "MÉTRICAS BÁSICAS", 
                        boardInit: `Riqueza vs Uniformidad <br/><br/> <span class='unknown-pulse text-4xl'>?</span>`, 
                        boardFinal: `<div class='flex flex-col text-2xl gap-2'><p><b>Riqueza:</b> Total de especies</p><p><b>Uniformidad:</b> Distribución</p></div>`,
                        updateData: { "Riqueza/Uniformidad": "Diferenciadas" },
                        fb_c: "La riqueza cuenta, la uniformidad evalúa proporciones.", fb_w: "Riqueza se refiere a la cantidad de especies distintas presentes."
                    },
                    {
                        q: "¿Cuál es la función principal del Índice de Simpson en los estudios ecológicos?",
                        opts: [
                            "Combinar riqueza y abundancia mediante una escala logarítmica detallada.",
                            "Medir la probabilidad de que dos individuos elegidos al azar sean de la misma especie, evaluando la dominancia.",
                            "Contar el número exacto de bacterias en muestras microbiológicas.",
                            "Estimar la tasa de deforestación por hectárea en bosques tropicales."
                        ], ans: 1,
                        boardTag: "ÍNDICE DE SIMPSON", 
                        boardInit: `D = Σ(n/N)² <br/><br/> Evalúa: <span class='unknown-pulse text-4xl'>?</span>`, 
                        boardFinal: `Simpson Evalúa: <br/><br/> <b class='text-emerald-400 font-bold text-5xl'>Dominancia</b>`, 
                        updateSim: { nodes: 150, nodeSize: 0.8 },
                        fb_c: "Simpson se centra en la dominancia de especies comunes.", fb_w: "Este índice está muy relacionado con la probabilidad y especies dominantes."
                    },
                    {
                        q: "¿Qué distingue al Índice de Shannon-Wiener frente a otros índices de biodiversidad?",
                        opts: [
                            "Excluye la abundancia de especies para centrarse únicamente en la genética celular.",
                            "Cuantifica únicamente la contaminación de dióxido de carbono en zonas urbanas.",
                            "Combina riqueza y abundancia de especies utilizando una escala logarítmica, ideal para estudios detallados.",
                            "Evalúa la masa total de nutrientes absorbidos por las plantas."
                        ], ans: 2,
                        boardTag: "ÍNDICE DE SHANNON", 
                        boardInit: `H' = -Σ(p_i * ln(p_i)) <br/><br/> Diferenciador: <span class='unknown-pulse text-4xl ml-2'>?</span>`, 
                        boardFinal: `Shannon-Wiener: <br/><br/> <b class='text-emerald-400 font-black text-4xl drop-shadow-lg'>Riqueza + Abundancia (Log)</b>`, 
                        updateData: { "Índices": "Simpson & Shannon Listos" }, updateSim: { connectDist: 30, speed: 2 },
                        fb_c: "¡Módulo completado! Shannon es ideal para conocer la diversidad real.", fb_w: "Utiliza logaritmos naturales (ln) y considera tanto la riqueza como la abundancia equitativamente.", isFinal: true
                    }
                ]
            },
            {
                id: 3, 
                title: "Módulo 3: Estadísticas y Amenazas",
                story: `La red de la vida está bajo presión. Examinemos los datos sobre especies amenazadas y los factores humanos que impulsan la pérdida de biodiversidad.`,
                initialData: { "Especies Conocidas": "?", "Total Estimado": "?", "En Peligro": "?", "Amenazas Clave": "?" },
                steps: [
                    {
                        q: "Según los datos reportados, ¿cuántas especies se conocen actualmente frente al número total estimado en el planeta?",

                            "Se conocen 500 mil especies de un estimado total de 2 millones.",

                            "Se conocen 14 millones de especies y no existen más por descubrir."

                        boardTag: "INVENTARIO GLOBAL", 
                        boardInit: `Conocidas: <span class='unknown-pulse text-4xl'>?</span> <br/> Total Estimado: <span class='unknown-pulse text-4xl'>?</span>`, 
                        boardFinal: `Conocidas: <b class='text-white font-bold'>1,4M</b> <br/><br/> Estimado: <b class='text-white font-bold'>10M a 100M</b>`, 
                        updateData: { "Especies Conocidas": "1,4 Millones", "Total Estimado": "10-100 Millones" }, fb_c: "Correcto. Aún ignoramos a la inmensa mayoría de las especies.", fb_w: "Pista: La cifra de especies estimadas supera ampliamente los 10 millones."

                    {
                        q: "De las más de 47,000 especies evaluadas citadas en los estudios, ¿qué porcentaje aproximado se encuentra en peligro de extinción?",

                            "Aproximadamente el 22%.",
                            "En torno al 36%.",

                        boardTag: "ESTADO DE CONSERVACIÓN", 
                        boardInit: `Especies en Riesgo = <span class='unknown-pulse text-5xl ml-4'>?</span>`,

                        boardTag: "MOTORES DE EXTINCIÓN", 
                        boardInit: `5 Amenazas = <span class='unknown-pulse text-4xl ml-2'>?</span>`, 
                        boardFinal: `Amenazas: <br/><b class='text-red-400 font-bold text-2xl'>Hábitat, Explotación, Contaminación, Invasoras, Clima</b>`,

                    },
                    {
                        q: "¿Qué diferencia crítica existe entre el monocultivo y la permacultura respecto al suelo?",
                        opts: [
                            "El monocultivo regenera nutrientes rápidamente, mientras que la permacultura los agota.",

                    }

            {
                id: 4,

        const SoundEngine = {
            ctx: null,
            isMuted: false,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            toggleMute(m) { this.isMuted = m; },
            playTone(freq, type, duration, vol = 0.65) {
                if (!this.ctx || this.isMuted) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            },
            hover() { this.playTone(900, 'sine', 0.05, 0.1); },
            click() { this.playTone(800, 'square', 0.05, 0.2); },
            correct() { 
                this.playTone(523, 'triangle', 0.15, 0.4);
                setTimeout(() => this.playTone(659, 'triangle', 0.15, 0.4), 100);
                setTimeout(() => this.playTone(1046, 'sine', 0.4, 0.5), 200); 
            },
            wrong() { 
                this.playTone(250, 'sawtooth', 0.3, 0.4); 
                setTimeout(() => this.playTone(150, 'sawtooth', 0.4, 0.5), 150); 
            },
            success() {
                this.playTone(400, 'sine', 0.1, 0.3);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.3), 100);
                setTimeout(() => this.playTone(800, 'sine', 0.3, 0.3), 200);
            }
        };

        const SpeakerIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6 text-emerald-400"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const SpeakerXIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6 text-pink-500"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>;

        const BioParticlesBackground = () => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                let w = canvas.width = window.innerWidth;
                let h = canvas.height = window.innerHeight;
                
                const handleResize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
                window.addEventListener('resize', handleResize);

                const symbols = ['🌿', '🧬', '🌍', 'H₂O', 'O₂', 'Eco', 'Bio', 'Diversidad', 'Gen'];
                const colors = ['#10b981', '#34d399', '#059669', '#fbbf24', '#38bdf8'];
                
                const particles = Array.from({ length: 60 }).map(() => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    r: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    text: Math.random() > 0.75 ? symbols[Math.floor(Math.random() * symbols.length)] : null,
                    pulse: Math.random() * Math.PI * 2
                }));

                const draw = () => {
                    ctx.clearRect(0, 0, w, h);
                    
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = particles[i].color;
                                ctx.globalAlpha = 0.1 * (1 - dist/120);
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.pulse += 0.03;

                        if (p.x < 0 || p.x > w) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;

                        ctx.globalAlpha = 0.3 + Math.sin(p.pulse) * 0.3;
                        
                        if (p.text) {
                            ctx.font = 'bold 18px "JetBrains Mono"';
                            ctx.fillStyle = p.color;
                            ctx.textAlign = 'center';
                            ctx.fillText(p.text, p.x, p.y);
                        } else {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            ctx.fillStyle = p.color;
                            ctx.fill();
                        }
                    });
                    
                    ctx.globalAlpha = 1;
                    animId = requestAnimationFrame(draw);
                };
                draw();
                return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', handleResize); };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none opacity-60" />;
        };

        const BioSimulation3D = ({ simRef }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                if (!mountRef.current) return;
                
                const scene = new THREE.Scene(); 
                scene.fog = new THREE.FogExp2(0x020b06, 0.012);
                
                const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
                camera.position.set(25, 15, 35); 
                
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
                mountRef.current.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                
                const colorNormal = new THREE.Color(0x10b981); // Emerald
                const colorAlert = new THREE.Color(0xf43f5e);  // Red
                let currentColor = colorNormal.clone();

                const MAX_NODES = 250;
                let activeNodes = 100;
                let connectionThreshold = 18;
                let simSpeed = 1.0;

                const nodesGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(MAX_NODES * 3);
                const velocities = [];

                for (let i = 0; i < MAX_NODES; i++) {
                    const r = 18;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    
                    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = r * Math.cos(phi);

                    velocities.push(new THREE.Vector3(
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1
                    ));
                }

                nodesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                nodesGeometry.setDrawRange(0, activeNodes);

                const materialSphere = new THREE.PointsMaterial({
                    color: currentColor,
                    size: 1.2,
                    transparent: true,
                    opacity: 0.9,
                    sizeAttenuation: true
                });
                
                const pointCloud = new THREE.Points(nodesGeometry, materialSphere);
                scene.add(pointCloud);

                // Lines structure
                const linesGeometry = new THREE.BufferGeometry();
                const maxLines = (MAX_NODES * (MAX_NODES - 1)) / 2;
                const linePositions = new Float32Array(maxLines * 6);
                linesGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
                
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: currentColor,
                    transparent: true,
                    opacity: 0.25
                });
                const linesMesh = new THREE.LineSegments(linesGeometry, lineMaterial);
                scene.add(linesMesh);

                let mouseX = 0, mouseY = 0;
                const handleMouseMove = (e) => { 
                    mouseX = ((e.clientX / window.innerWidth) * 2 - 1) * 8; 
                    mouseY = ((e.clientY / window.innerHeight) * 2 - 1) * 8; 
                };
                document.addEventListener('mousemove', handleMouseMove);
                
                const handleResize = () => { 
                    camera.aspect = window.innerWidth / window.innerHeight; 
                    camera.updateProjectionMatrix(); 
                    renderer.setSize(window.innerWidth, window.innerHeight); 
                };
                window.addEventListener('resize', handleResize);

                simRef.current = {
                    setSimState: (opts) => {
                        if (opts.nodes !== undefined) {
                            activeNodes = Math.min(MAX_NODES, Math.max(10, opts.nodes));
                            nodesGeometry.setDrawRange(0, activeNodes);
                        }
                        if (opts.connectDist !== undefined) connectionThreshold = opts.connectDist;
                        if (opts.speed !== undefined) simSpeed = opts.speed;
                        if (opts.colorAlert !== undefined) {
                            const targetC = opts.colorAlert ? colorAlert : colorNormal;
                            gsap.to(currentColor, { r: targetC.r, g: targetC.g, b: targetC.b, duration: 1.5, onUpdate: () => {
                                materialSphere.color.copy(currentColor);
                                lineMaterial.color.copy(currentColor);
                            }});
                        }
                    },
                    setMode: (m) => {
                        if(m === 'center') gsap.to(camera.position, { x: 0, y: 0, z: 40, duration: 2, ease: "power2.out" });
                        else gsap.to(camera.position, { x: 25, y: 15, z: 35, duration: 2, ease: "power2.out" });
                    }
                };

                let animId;
                const anim = () => {
                    animId = requestAnimationFrame(anim);
                    
                    const time = Date.now() * 0.0005;
                    camera.position.x += (mouseX + Math.sin(time)*4 - camera.position.x) * 0.02;
                    camera.position.y += (-mouseY - camera.position.y) * 0.02;
                    camera.lookAt(0,0,0);

                    const posAttr = nodesGeometry.attributes.position;
                    let lineIndex = 0;

                    for (let i = 0; i < activeNodes; i++) {
                        let vx = velocities[i].x * simSpeed;
                        let vy = velocities[i].y * simSpeed;
                        let vz = velocities[i].z * simSpeed;

                        let px = posAttr.getX(i) + vx;
                        let py = posAttr.getY(i) + vy;
                        let pz = posAttr.getZ(i) + vz;

                        // Soft boundary constraints (Spherical)
                        const distToCenter = Math.sqrt(px*px + py*py + pz*pz);
                        if (distToCenter > 22) {
                            velocities[i].x -= (px / distToCenter) * 0.02;
                            velocities[i].y -= (py / distToCenter) * 0.02;
                            velocities[i].z -= (pz / distToCenter) * 0.02;
                        }

                        posAttr.setXYZ(i, px, py, pz);

                        // Calculate Connections
                        for (let j = i + 1; j < activeNodes; j++) {
                            const px2 = posAttr.getX(j);
                            const py2 = posAttr.getY(j);
                            const pz2 = posAttr.getZ(j);

                            const distSq = (px-px2)**2 + (py-py2)**2 + (pz-pz2)**2;
                            if (distSq < connectionThreshold * connectionThreshold) {
                                linePositions[lineIndex++] = px;
                                linePositions[lineIndex++] = py;
                                linePositions[lineIndex++] = pz;
                                linePositions[lineIndex++] = px2;
                                linePositions[lineIndex++] = py2;
                                linePositions[lineIndex++] = pz2;
                            }
                        }
                    }

                    posAttr.needsUpdate = true;
                    linesGeometry.setDrawRange(0, lineIndex / 3);
                    linesGeometry.attributes.position.needsUpdate = true;
                    
                    pointCloud.rotation.y += 0.001 * simSpeed;
                    linesMesh.rotation.y += 0.001 * simSpeed;

                    renderer.render(scene, camera);
                };
                anim();

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('mousemove', handleMouseMove);
                    if (mountRef.current) mountRef.current.innerHTML = '';
                };
            }, []);

            return <div ref={mountRef} id="three-container" />;
        };

                if (currentStep && boardState === 'init') {
                    const optionsObj = currentStep.opts.map((opt, idx) => ({ text: opt, isCorrect: idx === currentStep.ans }));
                    for (let i = optionsObj.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [optionsObj[i], optionsObj[j]] = [optionsObj[j], optionsObj[i]];

                    setShuffledOptions(optionsObj);
                }
            }, [currentStep, boardState]);

            const toggleMute = () => { setIsMuted(!isMuted); SoundEngine.toggleMute(!isMuted); };

            const goToMap = () => {
                setScreen('MAP');
                setRobotMood('idle');
                if (simRef.current) simRef.current.setMode('isometric');
            };

            const startExercise = (index) => {
                SoundEngine.click();
                setExIndex(index);
                setStepIndex(0);
                setCurrentExScore(100); 
                setCollectedData(ExercisesDB[index].initialData);
                setBoardState('init');
                setFeedback(null);
                setScreen('PLAY');
                setRobotMood('idle');
                if (simRef.current) {
                    simRef.current.setMode('center');
                    simRef.current.setSimState({ nodes: 80, connectDist: 18, colorAlert: false }); // Default start state
                }
            };

            const handleOptionClick = (isCorrect) => {
                SoundEngine.click();
                if (boardState === 'final' || feedback) return; 
                
                if (isCorrect) {
                    SoundEngine.correct();
                    setRobotMood('happy');
                    setFeedback({ correct: true, msg: currentStep.fb_c });
                    setBoardState('final'); 
                    
                    if (currentStep.updateSim && simRef.current) {
                        simRef.current.setSimState(currentStep.updateSim);
                    }
                    if (currentStep.updateData) {
                        setCollectedData(prev => ({...prev, ...currentStep.updateData}));
                    }
                } else {

                    setRobotMood('sad');
                    setCurrentExScore(prev => Math.max(0, prev - 20)); 
                    setFeedback({ correct: false, msg: currentStep.fb_w });
                }
            };

            const handleNext = () => {
                SoundEngine.click();
                setFeedback(null);
                setRobotMood('idle');

                    SoundEngine.success();
                    setScore(prev => prev + currentExScore);
                    
                    if (exIndex === highestUnlockedEx) {

                                const isLocked = i > highestUnlockedEx;

                                let nodeClass = "w-24 h-24 rounded-full flex items-center justify-center font-black text-3xl border-4 transition-all duration-500 ";
                                if (isActive) nodeClass += "bg-[#03150d] border-emerald-400 text-emerald-400 scale-125 shadow-[0_0_40px_rgba(16,185,129,0.9)] cursor-pointer";
                                else if (isDone) nodeClass += "bg-emerald-500 border-emerald-400 text-black shadow-[0_0_30px_rgba(16,185,129,0.5)] cursor-pointer hover:bg-emerald-400";
                                else nodeClass += "bg-[#062417] border-emerald-900/60 text-emerald-800/50 cursor-not-allowed opacity-60";
                                
                                return <div key={i} onClick={() => !isLocked && setExIndex(i)} onMouseEnter={() => SoundEngine.hover()} className={nodeClass}>{i+1}</div>;
                            })}
                        </div>
                        
                        <div className="bg-[#051c11] border border-emerald-500/40 p-12 rounded-3xl w-full mb-12 shadow-inner relative z-10">
                            <h3 className="text-5xl font-black text-emerald-400 mb-6 uppercase">{ExercisesDB[exIndex]?.title}</h3>
                            <p className="text-white text-2xl font-normal">Estación {exIndex + 1} de {ExercisesDB.length} disponible para escaneo.</p>
                        </div>
                        
                        <button onClick={() => startExercise(exIndex)} onMouseEnter={() => SoundEngine.hover()} className="py-6 px-14 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-black font-black text-3xl rounded-full shadow-[0_0_50px_rgba(16,185,129,0.5)] active:scale-95 transition-all uppercase tracking-widest relative z-10">
                            {exIndex < highestUnlockedEx ? 'REPETIR ANÁLISIS' : 'INICIAR ANÁLISIS'}
                        </button>
                    </div>
                </div>
            );

            const renderPlay = () => (
                <main className="flex-1 p-8 flex flex-col md:flex-row gap-10 relative z-10 w-full h-full max-w-[1920px] mx-auto pt-32">
                    
                    {/* PANEL IZQUIERDO */}
                    <div className="w-full md:w-5/12 flex flex-col gap-8 h-full z-20">
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-10 rounded-[2.5rem] shadow-xl backdrop-blur-sm">
                            <div className="flex justify-between items-center mb-8 pb-6 border-b border-emerald-900/50">
                                <span className="font-black text-emerald-400 text-2xl tracking-widest uppercase">{currentEx.title}</span>
                                <span className="text-sm bg-[#051f14] border border-emerald-500/50 text-emerald-300 font-bold px-5 py-2 rounded-full uppercase">Paso {stepIndex + 1}/{currentEx.steps.length}</span>
                            </div>
                            <p className="text-2xl text-slate-100 leading-relaxed font-normal" dangerouslySetInnerHTML={{__html: currentEx.story}}></p>
                        </div>
                        
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-10 rounded-[2.5rem] flex-1 flex flex-col shadow-xl backdrop-blur-sm">
                            <div className="flex justify-between items-center mb-8 pb-4 border-b border-emerald-900/50">
                                <h3 className="text-xl font-black text-emerald-600 tracking-[0.2em] uppercase">Datos Ecológicos</h3>
                                <span className="text-sm font-bold text-yellow-400">Puntaje Posible: {currentExScore}</span>
                            </div>
                            <div className="space-y-4 overflow-y-auto pr-4 custom-scrollbar">
                                {Object.entries(collectedData).map(([k, v], idx) => {
                                    const isUnknown = String(v).includes('?');
                                    return (
                                        <div key={idx} className="flex justify-between items-center bg-[#051c11] border border-emerald-900/40 px-6 py-4 rounded-2xl hover:border-emerald-500/40 transition-colors">
                                            <span className="text-slate-300 font-normal text-lg uppercase tracking-wide">{k}</span>
                                            <span className={`font-mono font-bold text-2xl ${isUnknown ? 'unknown-pulse' : 'text-emerald-400'}`}>{v}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* PANEL DERECHO */}
                    <div className="w-full md:w-7/12 flex flex-col gap-8 h-full z-20">
                        {/* PIZARRA */}
                        <div className="bg-[#03150d]/95 border-2 border-emerald-500/30 p-12 rounded-[3rem] flex flex-col items-center justify-center relative min-h-[40vh] shadow-[0_0_50px_rgba(0,0,0,0.6)] backdrop-blur-md">
                            <span className="absolute top-8 left-10 text-sm font-black tracking-[0.25em] text-emerald-500/60 uppercase">{currentStep.boardTag}</span>
                            <div className="text-4xl md:text-5xl font-mono text-white flex items-center justify-center font-normal tracking-wide text-center" 
                                dangerouslySetInnerHTML={{__html: boardState === 'init' ? currentStep.boardInit : currentStep.boardFinal}}>
                            </div>
                        </div>

                        {/* INTERACTIVIDAD */}
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-10 rounded-[3rem] flex-1 flex flex-col justify-center relative shadow-xl backdrop-blur-sm">
                            <h4 className="text-3xl font-bold mb-10 text-center text-white leading-snug">{currentStep.q}</h4>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-4">
                                {shuffledOptions.map((optObj, idx) => (
                                    <button key={idx} onClick={() => handleOptionClick(optObj.isCorrect)} onMouseEnter={() => SoundEngine.hover()} disabled={boardState === 'final' || feedback} 
                                        className="bg-[#061e14] hover:bg-[#0a2e1f] border-2 border-emerald-900/60 hover:border-emerald-400 p-5 rounded-3xl text-left transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed shadow-md flex items-center gap-4 group">
                                        <span className="w-12 h-12 rounded-xl bg-[#03150d] border border-emerald-800/50 group-hover:border-emerald-400 group-hover:text-emerald-400 text-slate-300 font-black text-xl flex items-center justify-center shrink-0 transition-colors">{['A', 'B', 'C', 'D'][idx]}</span>
                                        <span className="text-xl font-medium text-slate-200 group-hover:text-white leading-snug">{optObj.text}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* MODAL FEEDBACK */}
                    {feedback && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-8 rounded-[3rem] pointer-events-auto">
                            <div className={`bg-[#051c11] border-4 ${feedback.correct ? 'border-emerald-400' : 'border-red-500'} rounded-[3rem] shadow-2xl max-w-xl w-full p-12 flex flex-col items-center text-center`}>
                                <div className="w-32 h-32 mb-8"><ProfeBot color={COLORS.emerald} mood={robotMood} /></div>
                                <h3 className={`text-4xl font-black mb-6 uppercase tracking-wide ${feedback.correct ? 'text-emerald-400' : 'text-red-400'}`}>
                                    {feedback.correct ? '¡Análisis Correcto!' : 'Análisis Erróneo'}
                                </h3>
                                <p className="text-2xl text-white font-normal mb-10 leading-relaxed">{feedback.msg}</p>
                                
                                {feedback.correct ? (
                                    <button onClick={handleNext} onMouseEnter={() => SoundEngine.hover()} className="w-full py-6 px-8 bg-emerald-500 hover:bg-emerald-400 text-black font-black text-2xl rounded-2xl active:scale-95 transition-all uppercase tracking-wider shadow-[0_0_30px_rgba(16,185,129,0.4)]">
                                        {currentStep.isFinal ? 'Completar Módulo' : 'Siguiente Métrica →'}
                                    </button>
                                ) : (
                                    <button onClick={() => {setFeedback(null); setRobotMood('idle'); SoundEngine.click();}} onMouseEnter={() => SoundEngine.hover()} className="w-full py-5 px-8 bg-transparent border-4 border-red-500 text-red-400 hover:bg-red-500/10 font-black text-xl rounded-2xl active:scale-95 transition-all uppercase tracking-wider">
                                        Reevaluar Datos
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </main>
            );

            return (
                <div className="w-full h-screen bg-[#020b06] text-white flex flex-col overflow-hidden relative font-sans">
                    <BioSimulation3D simRef={simRef} />
                    <div className="perspective-grid" />
                    <div className="ambient-glow" />

                    {(screen !== 'START' && screen !== 'END') && (
                        <header className="absolute top-0 w-full h-28 bg-[#020e08]/80 backdrop-blur-xl border-b border-emerald-900/50 px-10 flex items-center justify-between z-40 shadow-lg">
                            <div className="flex flex-col">
                                <h1 className="text-3xl font-black tracking-wider leading-none">
                                    <span className="text-white">TUPROFE20</span> <span className="text-emerald-400">LAB</span>
                                </h1>
                                <span className="text-[12px] font-bold tracking-[0.3em] text-slate-400 mt-2 uppercase">BIODIVERSIDAD Y CONSERVACIÓN</span>
                            </div>
                            
                            <div className="flex items-center gap-8">
                                <div className="bg-[#051c11] border border-emerald-900/60 px-8 py-3 rounded-2xl flex items-center gap-5 shadow-inner">
                                    <span className="text-sm font-bold text-slate-400 uppercase tracking-widest">Score Vital</span>
                                    <span className="text-3xl font-black text-yellow-400 drop-shadow-md">{score}</span>
                                </div>
                                <button onClick={toggleMute} onMouseEnter={() => SoundEngine.hover()} className="w-14 h-14 bg-[#051c11] hover:bg-[#0a2e1f] border border-emerald-900/60 rounded-2xl flex items-center justify-center transition-all">
                                    {isMuted ? <SpeakerXIcon /> : <SpeakerIcon />}
                                </button>
                                {screen === 'PLAY' && (
                                    <button onClick={goToMap} onMouseEnter={() => SoundEngine.hover()} className="px-6 py-4 bg-[#051c11] hover:bg-[#0a2e1f] border border-emerald-900/60 text-emerald-100 font-bold text-lg rounded-2xl uppercase tracking-wider transition-all shadow-md">
                                        Ruta Principal
                                    </button>
                                )}
                            </div>
                        </header>
                    )}

                    {screen === 'START' && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center p-6 overflow-hidden">
                            <BioParticlesBackground />
                            <div className="max-w-4xl w-full bg-[#03150d]/95 border border-emerald-500/30 rounded-[3rem] p-16 flex flex-col items-center text-center shadow-[0_0_80px_rgba(16,185,129,0.15)] backdrop-blur-2xl relative z-10">
                                <span className="text-sm font-black tracking-[0.35em] text-emerald-400 uppercase mb-4">TUPROFE20 LAB • CCNN 5° AÑO</span>
                                <h1 className="text-5xl sm:text-7xl font-black tracking-wider text-white uppercase drop-shadow-[0_0_20px_rgba(16,185,129,0.5)] mb-2">
                                    LABORATORIO DE
                                </h1>
                                <h2 className="text-5xl sm:text-7xl font-black uppercase mb-12 bg-gradient-to-r from-emerald-400 via-teal-300 to-green-400 bg-clip-text text-transparent drop-shadow-[0_0_30px_rgba(16,185,129,0.2)]">
                                    BIODIVERSIDAD Y CONSERVACIÓN
                                </h2>
                                <div className="w-48 h-48 mb-12"><ProfeBot color={COLORS.emerald} mood="happy" /></div>
                                <button onClick={() => { SoundEngine.click(); setScreen('MAP'); }} onMouseEnter={() => SoundEngine.hover()} className="w-full max-w-md py-6 px-10 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-black font-black text-2xl rounded-full shadow-[0_0_40px_rgba(16,185,129,0.4)] active:scale-95 transition-all uppercase tracking-widest">
                                    ENTRAR AL SISTEMA
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {screen === 'MAP' && renderMap()}
                    {screen === 'PLAY' && renderPlay()}
                    
                    {screen === 'END' && (
                        <div className="absolute inset-0 z-50 flex flex-col justify-center items-center p-10 bg-[#020b06]/95 backdrop-blur-xl">
                            <div className="max-w-5xl w-full bg-[#03150d] border-2 border-emerald-400 rounded-[3rem] shadow-[0_0_90px_rgba(16,185,129,0.3)] p-20 flex flex-col items-center text-center relative overflow-hidden">
                                <div className="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/20 blur-[100px] rounded-full pointer-events-none"></div>
                                <h2 className="text-6xl font-black text-white tracking-tight uppercase mb-12 relative z-10">MÓDULOS DE CONSERVACIÓN COMPLETADOS</h2>
                                <div className="w-56 h-56 mb-12 relative z-10"><ProfeBot color={COLORS.emerald} mood="celebrate" /></div>
                                <div className="bg-[#051c11] border border-emerald-900/60 w-full p-12 rounded-3xl mb-16 shadow-inner relative z-10">
                                    <h3 className="text-2xl text-slate-400 uppercase tracking-widest font-bold mb-6">Eficiencia de Análisis Final</h3>
                                    <div className="text-9xl font-mono font-black text-yellow-400 drop-shadow-[0_0_30px_rgba(250,204,21,0.5)]">{score}</div>
                                </div>
                                <button onClick={() => window.location.reload()} onMouseEnter={() => SoundEngine.hover()} className="py-6 px-14 bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-black text-2xl rounded-2xl shadow-[0_0_35px_rgba(16,185,129,0.4)] transition-all active:scale-95 uppercase tracking-wider relative z-10">
                                    Reiniciar Sistema
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
